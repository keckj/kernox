site_name: kernox
site_description: Fused symbolic reductions on GPUs, built on symox
site_url: https://keckj.github.io/kernox/
repo_url: https://github.com/keckj/kernox
repo_name: keckj/kernox
copyright: kernox is dual-licensed MIT or Apache-2.0

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

hooks:
  - tools/mkdocs_hooks.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            docstring_style: sphinx
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets: {base_path: ["."], check_paths: true}

nav:
  - Home: index.md
  - User guide:
      - API and numerics: api.md
      - Support matrix: support-matrix.md
      - PyKeOps parity: pykeops-parity.md
  - Reference:
      - Python API: reference.md
  - Internals:
      - Core and backend contract: kernel-backend-contract.md
      - HIP backend: backend-hip.md
      - Conformance suite: conformance.md
