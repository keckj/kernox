site_name: kernox
site_description: Fused symbolic reductions on GPUs and CPUs, built on symox
site_url: https://keckj.github.io/kernox/
repo_url: https://github.com/keckj/kernox
repo_name: keckj/kernox
copyright: kernox is dual-licensed MIT or Apache-2.0

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

hooks:
  - tools/mkdocs_hooks.py

extra_css:
  - stylesheets/figures.css

plugins:
  - search
  - redirects:
      redirect_maps:
        # Pages of the first version of the site
        api.md: concepts.md
        support-matrix.md: backends.md
        pykeops-parity.md: pykeops.md
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            docstring_style: sphinx
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets: {base_path: ["."], check_paths: true}

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - User guide:
      - Concepts: concepts.md
      - Formula operations: operations.md
      - Numerics: numerics.md
  - How-to guides:
      - Kernel sums: guides/kernel-sums.md
      - Nearest neighbours: guides/nearest-neighbours.md
      - Log-sum-exp and Sinkhorn: guides/logsumexp.md
      - Gradients: guides/gradients.md
      - Batch dimensions: guides/batch.md
      - Block-sparse reductions: guides/block-sparse.md
      - Complex formulas: guides/complex.md
      - Linear systems: guides/linear-systems.md
      - Several GPUs or nodes: guides/distributed.md
      - Running on a cluster: guides/cluster.md
      - Half precision (FP16): guides/fp16.md
      - Faster exp and log: guides/fast-math.md
      - Autotuning and wisdom: guides/autotuning.md
  - Coming from PyKeOps: pykeops.md
  - Backends and hardware: backends.md
  - API reference: reference.md
  - Contributing:
      - Contributing: contributing.md
      - Core and backend contract: kernel-backend-contract.md
      - HIP backend: backend-hip.md
      - CPU backend: backend-cpu.md
      - Conformance suite: conformance.md
