[build-system]
requires = ["setuptools>=77"]  # PEP 639: SPDX license expression, license-files
build-backend = "setuptools.build_meta"

[project]
name = "kernox"
version = "1.2.0"
description = "Fused symbolic reductions on GPUs (CUDA, ROCm/HIP, SYCL) and x86-64 CPUs (OpenMP, SIMD), on one device or optionally split across several GPUs or nodes, built on symox"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "THIRD_PARTY.md"]
requires-python = ">=3.10"
authors = [{ name = "Jean-Baptiste Keck" }]
keywords = ["gpu", "cpu", "cuda", "rocm", "sycl", "openmp", "simd", "kernel", "reduction", "pytorch", "keops"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Environment :: GPU :: NVIDIA CUDA",
]
# torch: installed from the platform-specific index (CUDA, ROCm, XPU); the extras
# only set its minimum version, the index is chosen at install time.
dependencies = ["numpy>=2.3", "symox>=0.1.1"]

[project.optional-dependencies]
# Lower bounds = versions actually tested.
# NVRTC: PyPI wheel loaded by the cuda backend (tested with 12.6 and 12.8).
cuda = ["torch>=2.11", "nvidia-cuda-nvrtc-cu12>=12.6"]
# ROCm: torch 2.15.0+rocm10.0 (index download.pytorch.org/whl/rocm10.0), hipRTC shipped with torch.
rocm = ["torch>=2.15"]
# XPU: torch 2.15.0+xpu (index download.pytorch.org/whl/xpu). The SYCL runtime
# must be at least as recent as the host icpx (2026.2): it is upgraded with
# `pip install --no-deps` (docs/getting-started.md, "Intel GPUs"), not here,
# because torch pins its runtime exactly and pip would replace the XPU build of
# torch with the CUDA one to satisfy a newer runtime requirement.
xpu = ["torch>=2.15"]
test = ["pytest>=8.4"]

[project.urls]
Homepage = "https://github.com/keckj/kernox"
Documentation = "https://keckj.github.io/kernox/"
Source = "https://github.com/keckj/kernox"
Issues = "https://github.com/keckj/kernox/issues"
Changelog = "https://github.com/keckj/kernox/releases"
symox = "https://github.com/keckj/symox"

[tool.setuptools.packages.find]
include = ["kernox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: actually runs a kernel on a GPU",
  "bench: benchmark, run only on an idle GPU",
  "slow: long profile, excluded from the quick CI profile",
]
